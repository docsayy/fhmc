<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FHMC Directory</title>

<style>
:root{
  --bg:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
  --chip:#f3f4f6;
}

*{box-sizing:border-box;}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.wrap{width:min(1100px,calc(100% - 24px));margin:auto;}

header{
  position:sticky;
  top:0;
  background:rgba(255,255,255,0.95);
  border-bottom:1px solid var(--border);
}

.title{font-size:20px;padding-top:14px;}
.subtitle{font-size:13px;color:var(--muted);padding-bottom:8px;}

.controls{display:flex;gap:10px;padding-bottom:10px;}
.search{
  flex:1;height:44px;padding:10px 12px;
  border:1px solid var(--border);border-radius:10px;
  font-size:15px;outline:none;
}
.btn{
  height:44px;padding:0 14px;
  border:1px solid var(--border);border-radius:10px;
  background:#fff;font-size:14px;cursor:pointer;
}

.status{font-size:13px;color:var(--muted);padding-bottom:12px;}

main{padding:10px 0 40px;}

.section{margin:16px 0 18px;}
.section-title{
  font-size:14px;
  color:var(--muted);
  margin:10px 0 8px;
}

.list{
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.row{
  display:grid;
  grid-template-columns: 260px 1fr 1.6fr;
  gap:10px;
  padding:10px 12px;
  border-top:1px solid var(--border);
  align-items:center;
}

.row:first-child{border-top:none;}

.cell{
  font-size:14px;
  line-height:1.3;
  min-width:0;
  word-break:break-word;
}

.muted{color:var(--muted);}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}

.chip{
  display:inline-flex;
  align-items:center;
  height:32px;
  padding:0 10px;
  border-radius:999px;
  background:var(--chip);
  border:1px solid var(--border);
  font-size:13px;
  text-decoration:none;
  color:var(--text);
  white-space:nowrap;
}

.pager{
  display:inline-flex;
  align-items:center;
  height:32px;
  padding:0 10px;
  border-radius:999px;
  border:1px solid var(--border);
  font-size:13px;
  white-space:nowrap;
}

.empty{
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  color:var(--muted);
}

footer{
  border-top:1px solid var(--border);
  padding:14px 0;
  font-size:12px;
  color:var(--muted);
}

@media (max-width: 820px){
  .row{grid-template-columns:1fr;gap:6px;}
  .cell.muted{font-size:13px;}
}
</style>
</head>

<body>
<header>
  <div class="wrap">
    <div class="title">FHMC Directory</div>

    <div class="controls">
      <input id="search" class="search" placeholder="Search name, category, extension…" />
      <button id="clear" class="btn">Clear</button>
    </div>

    <div id="status" class="status">Loading…</div>
  </div>
</header>

<main class="wrap">
  <div id="content"></div>
</main>

<footer>
  <div class="wrap">
    Make everyday work a little easier — Moh Sayyar, MD
  </div>
</footer>

<script>
(() => {
  const content = document.getElementById("content");
  const status = document.getElementById("status");
  const search = document.getElementById("search");
  const clearBtn = document.getElementById("clear");

  // FHMC mapping: 4-digit extensions become 718-670-XXXX
  // tel:+1718670XXXX
  const FHMC_PREFIX = "1718670"; // +1 718 670

  const norm = v => String(v ?? "").toLowerCase().trim();
  const digits = v => String(v ?? "").replace(/\D+/g,"");

  function escapeHtml(s){
    return String(s ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

  // Build tel: link
  // - 4 digits -> tel:+1718670XXXX
  // - 10 digits -> tel:+1XXXXXXXXXX
  // - 11 digits starting with 1 -> tel:+1XXXXXXXXXX
  function telFromCallValue(c){
    const d = digits(c);

    if (d.length === 4) return `tel:+${FHMC_PREFIX}${d}`;
    if (d.length === 10) return `tel:+1${d}`;
    if (d.length === 11 && d.startsWith("1")) return `tel:+${d}`;

    // fallback (still tries)
    return `tel:${d || String(c ?? "").trim()}`;
  }

  function buildHaystack(e){
    return [
      e.category, e.name, e.notes,
      e.pager,
      (e.call||[]).join(" "),
      (e.fax||[]).join(" ")
    ].map(norm).join(" ");
  }

  function normalizeCategory(cat){
    const c = String(cat ?? "").trim();
    return c || "Other";
  }

  function pagerValue(e){
    // Prefer explicit pager field
    const p = String(e.pager ?? "").trim();
    if (p) return p;

    // If someone wrote "Page 74705" in notes, extract it
    const n = String(e.notes ?? "");
    const m = n.match(/page\s*([0-9]{3,8})/i);
    return m ? m[1] : "";
  }

  function render(list){
    if(!list.length){
      content.innerHTML = '<div class="empty">No results.</div>';
      return;
    }

    const groups = new Map();
    for(const e of list){
      const cat = normalizeCategory(e.category);
      if(!groups.has(cat)) groups.set(cat, []);
      groups.get(cat).push(e);
    }

    let html = "";
    for(const [cat, items] of groups.entries()){
      html += `<div class="section">
        <div class="section-title">${escapeHtml(cat)}</div>
        <div class="list">`;

      for(const e of items){
        const name = escapeHtml(e.name ?? "");
        const notesRaw = String(e.notes ?? "").trim();
        const calls = Array.isArray(e.call) ? e.call : [];
        const faxes = Array.isArray(e.fax) ? e.fax : [];
        const pager = pagerValue(e);

        // Hide notes if it's just "Page ####" to avoid duplicate clutter
        const notesIsJustPager = /^page\s*\d+$/i.test(notesRaw);
        const notes = (!notesIsJustPager && notesRaw) ? notesRaw : "";

        let actions = "";

        if(calls.length){
          actions += `<span class="muted">Call:</span>`;
          for(const c of calls){
            const label = String(c ?? "").trim();
            if(!label) continue;
            actions += ` <a class="chip" href="${telFromCallValue(label)}">${escapeHtml(label)}</a>`;
          }
        }

        if(faxes.length){
          actions += (actions ? " " : "") + `<span class="muted">Fax:</span>`;
          for(const f of faxes){
            const label = String(f ?? "").trim();
            if(!label) continue;
            actions += ` <span class="chip">${escapeHtml(label)}</span>`;
          }
        }

        if(pager){
          actions += (actions ? " " : "") + `<span class="pager">page ${escapeHtml(pager)}</span>`;
        }

        html += `<div class="row">
          <div class="cell">${name}</div>
          <div class="cell muted">${notes ? escapeHtml(notes) : ""}</div>
          <div class="cell actions">${actions}</div>
        </div>`;
      }

      html += `</div></div>`;
    }

    content.innerHTML = html;
  }

  async function load(){
    try{
      const res = await fetch("./assets/data/directory.json", { cache:"no-store" });
      if(!res.ok) throw new Error("HTTP " + res.status);

      const data = await res.json();
      if(!Array.isArray(data)) throw new Error("directory.json must be a JSON array");

      const enriched = data.map(e => ({...e, _h:buildHaystack(e)}));
      status.textContent = `Loaded ${enriched.length} entries`;
      render(enriched);

      function runSearch(){
        const q = norm(search.value);
        if(!q){
          status.textContent = `Loaded ${enriched.length} entries`;
          render(enriched);
          return;
        }
        const filtered = enriched.filter(e => e._h.includes(q));
        status.textContent = `Showing ${filtered.length} results`;
        render(filtered);
      }

      search.addEventListener("input", runSearch);
      clearBtn.addEventListener("click", ()=>{
        search.value = "";
        search.focus();
        runSearch();
      });

    }catch(err){
      console.error(err);
      status.textContent = "Failed to load directory.json";
      content.innerHTML = '<div class="empty">Directory not loaded.</div>';
    }
  }

  load();
})();
</script>
</body>
</html>
