<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FHMC Directory</title>

<style>
:root{
  --bg:#ffffff;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
  --chip:#f3f4f6;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.wrap{width:min(1000px,calc(100% - 24px));margin:auto}

.topbar{
  position:sticky;
  top:0;
  background:rgba(255,255,255,.95);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(6px);
}

.title{font-size:20px;padding-top:14px}
.subtitle{font-size:13px;color:var(--muted);padding-bottom:10px}

.controls{display:flex;gap:10px;padding-bottom:10px}

.search{
  flex:1;
  height:44px;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:15px;
}

.btn{
  height:44px;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  font-size:14px;
  cursor:pointer;
}

.status{font-size:13px;color:var(--muted);padding-bottom:12px}

.content{padding:14px 0 40px}

.section{margin:14px 0 22px}
.section-title{font-size:14px;color:var(--muted);margin-bottom:10px}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:12px;
}

.card{
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--card);
  padding:12px;
}

.name{font-size:16px}

.notes{margin-top:6px;font-size:13px;color:var(--muted)}

.line{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.label{font-size:13px;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.chip{
  height:34px;
  padding:0 10px;
  border-radius:999px;
  background:var(--chip);
  border:1px solid var(--border);
  font-size:13px;
  text-decoration:none;
  color:var(--text);
  display:inline-flex;
  align-items:center;
}

.pager{
  font-size:13px;
  padding:6px 10px;
  border:1px solid var(--border);
  border-radius:999px;
  background:#fff;
}

.empty{
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  color:var(--muted);
}

.footer{
  border-top:1px solid var(--border);
  padding:14px 0;
  font-size:12px;
  color:var(--muted);
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="title">FHMC Directory</div>
    <div class="subtitle">Search extensions and pagers</div>

    <div class="controls">
      <input id="search" class="search" placeholder="Search name, category, extension…" />
      <button id="clear" class="btn">Clear</button>
    </div>

    <div id="status" class="status">Loading…</div>
  </div>
</header>

<main class="wrap">
  <div id="content" class="content"></div>
</main>

<footer class="footer">
  <div class="wrap">Make everyday work a little easier — Moh Sayyar, MD</div>
</footer>

<script>
(() => {
  const content = document.getElementById("content");
  const status = document.getElementById("status");
  const search = document.getElementById("search");
  const clearBtn = document.getElementById("clear");

  const norm = v => String(v ?? "").toLowerCase().trim();
  const digitsOnly = v => String(v ?? "").replace(/\\D+/g,"");

  const escapeHtml = s =>
    String(s ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;");

  const haystack = e => [
    e.category,e.name,e.notes,e.pager,
    ...(e.call||[]),...(e.fax||[])
  ].map(norm).join(" ");

  function telHref(v){
    const d = digitsOnly(v);
    return "tel:"+(d||v);
  }

  function render(entries){
    if(!entries.length){
      content.innerHTML = '<div class="empty">No results.</div>';
      return;
    }

    const groups = new Map();
    entries.forEach(e=>{
      const c = e.category || "Other";
      if(!groups.has(c)) groups.set(c,[]);
      groups.get(c).push(e);
    });

    let html="";
    for(const [cat,list] of groups){
      html+=`<section class="section"><div class="section-title">${escapeHtml(cat)}</div><div class="cards">`;

      list.forEach(e=>{
        html+=`<div class="card"><div class="name">${escapeHtml(e.name)}</div>`;

        if(e.notes) html+=`<div class="notes">${escapeHtml(e.notes)}</div>`;

        if(e.call?.length){
          html+=`<div class="line"><span class="label">call:</span><div class="chips">`;
          e.call.forEach(c=>{
            html+=`<a class="chip" href="${telHref(c)}">${escapeHtml(c)}</a>`;
          });
          html+=`</div></div>`;
        }

        if(e.fax?.length){
          html+=`<div class="line"><span class="label">fax:</span><div class="chips">`;
          e.fax.forEach(f=>{
            html+=`<span class="chip">${escapeHtml(f)}</span>`;
          });
          html+=`</div></div>`;
        }

        if(e.pager){
          html+=`<div class="line"><span class="label">pager:</span><span class="pager">page ${escapeHtml(e.pager)}</span></div>`;
        }

        html+=`</div>`;
      });

      html+=`</div></section>`;
    }

    content.innerHTML = html;
  }

  async function load(){
    try{
      const res = await fetch("./assets/data/directory2.json",{cache:"no-store"});
      const data = await res.json();
      const enriched = data.map(e=>({...e,__h:haystack(e)}));

      status.textContent = `Loaded ${enriched.length} entries`;
      render(enriched);

      const run = ()=>{
        const q = norm(search.value);
        if(!q){
          status.textContent = `Loaded ${enriched.length} entries`;
          render(enriched);
          return;
        }
        const f = enriched.filter(e=>e.__h.includes(q));
        status.textContent = `Showing ${f.length} of ${enriched.length}`;
        render(f);
      };

      search.addEventListener("input",run);
      clearBtn.addEventListener("click",()=>{
        search.value="";
        run();
      });

    }catch(err){
      status.textContent="Failed to load directory.json";
      content.innerHTML='<div class="empty">Directory failed to load.</div>';
      console.error(err);
    }
  }

  load();
})();
</script>

</body>
</html>
