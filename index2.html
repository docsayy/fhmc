<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FHMC Directory</title>
  <link rel="stylesheet" href="./assets/styles2.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="title">FHMC Directory</div>
      <div class="subtitle">Search extensions and pagers</div>

      <div class="controls">
        <input id="search" class="search" type="search" placeholder="Search name, category, extension, notes…" autocomplete="off" />
        <button id="clear" class="btn" type="button">Clear</button>
      </div>

      <div id="status" class="status">Loading…</div>
    </div>
  </header>

  <main class="wrap">
    <div id="content" class="content"></div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <div class="footnote">Tip: type “4N”, “radiology”, “lab”, or an extension.</div>
    </div>
  </footer>

  <script src="./assets/app2.js" defer></script>
</body>
</html>
