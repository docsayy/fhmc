<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FHMC Directory</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body class="page">

<header class="topbar">
  <div class="topbar__title">
    <p class="muted">Tap to call. Tap pager to send a page.</p>
  </div>
  <div class="topbar__controls">
    <input id="search" type="search" placeholder="Search name, category, extension, pager..." />
  </div>
</header>

<main class="container">
  <div id="status" class="status muted">Loading…</div>
  <div id="content"></div>
</main>

<footer class="footer">
  <p class="credits">Make everyday work a little easier — Moh Sayyar, MD</p>
</footer>

<div id="toast" class="toast" aria-live="polite"></div>

<script src="./assets/paging.js"></script>
<script src="./assets/data/directory2.js"></script>
<script src="./assets/app2.js"></script>

  <div id="directoryRoot"></div>

<!-- Test pager overlay (basic) -->
<div id="pagerOverlay" style="display:none;">
  <div class="modal">
    <div><strong id="pagerWho"></strong></div>
    <div>Pager: <span id="pagerNum"></span></div>
    <textarea id="pagerMsg" placeholder="Message..."></textarea>
    <div class="actions">
      <button class="btn secondary" onclick="closePagerBox()">Close</button>
      <button class="btn" disabled>Send (coming)</button>
    </div>
  </div>
</div>


</body>
</html>
