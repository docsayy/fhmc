      border-radius: 16px;
      overflow: hidden;
    }
    .row {
      padding: 12px 12px;
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .row:first-child { border-top: none; }
    .topline { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
    .left { min-width: 0; }
    .name { font-weight: 700; font-size: 14px; margin: 0; }
    .meta { font-size: 12px; margin: 3px 0 0; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; padding: 7px 10px; border-radius: 999px;
      background: rgba(80,180,255,.12); border: 1px solid rgba(80,180,255,.25);
      color: #bfe7ff; text-decoration: none;
    }
    .chip.fax {
      background: rgba(255,190,80,.10); border-color: rgba(255,190,80,.25);
      color: #ffe2b8;
    }
    .chip.note {
      background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12);
      color: rgba(255,255,255,.82);
      cursor: default;
    }
    .hint { font-size: 12px; opacity: .7; margin-top: 8px; }
    footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(11,15,20,.92); backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255,255,255,.08);
      padding: 10px 14px;
      font-size: 12px; opacity: .85;
    }

  const EXT_PREFIX = "718670"; // becomes +1-718-670-XXXX

  // Helper: normalize to digits
  const digits = s => (s ?? "").toString().replace(/\D/g, "");

  // Build tel links:
  // - If ext is 4 digits: tel:+1718670XXXX
  // - If full 10 digits: tel:+1XXXXXXXXXX
  // - If already includes country code digits length 11 (1XXXXXXXXXX): tel:+1XXXXXXXXXX
  function telFromAny(value) {
    const d = digits(value);
    if (!d) return null;
    if (d.length === 4) return `tel:+1${EXT_PREFIX}${d}`;
    if (d.length === 10) return `tel:+1${d}`;
    if (d.length === 11 && d.startsWith("1")) return `tel:+${d}`;
    return null; // unknown format
  }

  // Pretty formatting for display
  function fmtPhone(value) {
    const d = digits(value);
    if (d.length === 4) return `718-670-${d}`;
    if (d.length === 10) return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;
    if (d.length === 11 && d.startsWith("1")) return `${d.slice(1,4)}-${d.slice(4,7)}-${d.slice(7)}`;
    return value;
  }

      unit: "",
      phones: [{ label: "Ext", value: "4596" }]
    },
    {
      section: "Other Departments",
      name: "Security",
      role: "Security",
      unit: "",
      phones: [
        { label: "Ext", value: "8067" },
        { label: "Ext", value: "4566" },
        { label: "Ext", value: "3333" },
        { label: "Sgt Desk", value: "8859" }
      ]
    }
  ];

  const app = document.getElementById("app");
  const q = document.getElementById("q");

  function groupBySection(items) {
    const m = new Map();
    for (const it of items) {
      const key = it.section || "Directory";
      if (!m.has(key)) m.set(key, []);
      m.get(key).push(it);
    }
    return [...m.entries()];
  }

  function render() {
    const term = q.value.trim().toLowerCase();
    const filtered = DATA.filter(it => {
      const hay = [
        it.section, it.name, it.role, it.unit, it.note,
        ...(it.phones || []).map(p => `${p.label} ${p.value}`),
        it.fax ? `fax ${it.fax}` : ""
      ].join(" ").toLowerCase();
      return hay.includes(term);
    });

    app.innerHTML = "";
    const sections = groupBySection(filtered);

    for (const [section, items] of sections) {
      const sec = document.createElement("div");
      sec.className = "section";
      sec.innerHTML = `<h2>${section}</h2>`;

      const card = document.createElement("div");
      card.className = "card";

      for (const it of items) {
        const row = document.createElement("div");
        row.className = "row";

        const topline = document.createElement("div");
        topline.className = "topline";

        const left = document.createElement("div");
        left.className = "left";
        left.innerHTML = `
          <p class="name">${it.name}</p>
          <p class="meta">${[it.role, it.unit].filter(Boolean).join(" • ")}</p>
        `;

        topline.appendChild(left);
        row.appendChild(topline);

        const chips = document.createElement("div");
        chips.className = "chips";

        // Phone chips
        for (const p of (it.phones || [])) {
          const href = telFromAny(p.value);
          const label = `${p.label}: ${fmtPhone(p.value)}`;
          if (href) {
            const a = document.createElement("a");
            a.className = "chip";
            a.href = href;
            a.textContent = label;
            chips.appendChild(a);
          } else {
            const span = document.createElement("span");
            span.className = "chip note";
            span.textContent = label;
            chips.appendChild(span);
          }
        }

        // Fax chip (display; can be tel if you want)
        if (it.fax) {
          const faxHref = telFromAny(it.fax); // optional dialing for fax line
          const faxLabel = `Fax: ${fmtPhone(it.fax)}`;
          if (faxHref) {
            const a = document.createElement("a");
            a.className = "chip fax";
            a.href = faxHref;
            a.textContent = faxLabel;
            chips.appendChild(a);
          } else {
            const span = document.createElement("span");
            span.className = "chip fax";
            span.textContent = faxLabel;
            chips.appendChild(span);
          }
        }

        // Notes
        if (it.note) {
          const span = document.createElement("span");
          span.className = "chip note";
          span.textContent = it.note;
          chips.appendChild(span);
        }

        row.appendChild(chips);
        card.appendChild(row);
      }

      sec.appendChild(card);
      app.appendChild(sec);
    }
  }

  q.addEventListener("input", render);
  render();
</script>
</body>
</html>
